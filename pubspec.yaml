name: aero
description: "Offline peer-to-peer file transfer between nearby devices."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Discovery: mDNS / DNS-SD browse + advertise with TXT records.
  # Only package covering all 5 native desktop/mobile OSes with both roles.
  bonsoir: ^7.1.5

  # Crypto: Ed25519 keygen/sign, X25519, SHA-256, HKDF, AES-GCM.
  cryptography: ^2.7.0
  # Native-accelerated implementations (falls back to pure Dart).
  cryptography_flutter: ^2.3.2

  # File selection + receive/save flow.
  file_picker: ^13.1.0
  file_saver: ^0.6.0
  path: ^1.9.0
  path_provider: ^2.1.6

  logging: ^1.3.0
  uuid: ^4.5.1

  # QR generation for the manual-pairing tier. Pure Dart (no native code), so it
  # works on every target and adds no build complexity. Only *generation* is
  # used: a QR renderer turns the aero:// connection string into a scannable
  # code. Scanning is deliberately not added - it needs camera + native code,
  # and typing the string still works without it.
  qr: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs on the real macOS engine with real platform channels. mDNS cannot be
  # exercised by unit tests at all: bonsoir's Darwin backend talks to
  # mDNSResponder through a real FlutterMethodChannel, which only exists inside
  # a running Flutter app.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true